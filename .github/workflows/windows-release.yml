name: Build Windows EXE

on:
  push:
    tags:
      - 'v[0-9]*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: windows-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    name: Test, build and package Windows x64
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    env:
      PYTHONIOENCODING: utf-8
      QT_QPA_PLATFORM: offscreen
      QT_QUICK_BACKEND: software

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'
          architecture: x64
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-build.txt

      - name: Resolve package version
        id: version
        run: |
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            $version = $env:GITHUB_REF_NAME -replace '^v', ''
          } else {
            $version = python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])"
            if ($LASTEXITCODE -ne 0) { throw 'Cannot read project version.' }
          }
          if ($version -notmatch '^\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?$') {
            throw 'Use a version tag such as v1.0.0 or v1.1.0-beta.1.'
          }
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Install dependencies
        run: |
          python -m pip install -r requirements-build.txt
          if ($LASTEXITCODE -ne 0) { throw 'Dependency installation failed.' }

      - name: Run tests
        run: |
          python -m unittest discover -s tests -v
          if ($LASTEXITCODE -ne 0) { throw 'Tests failed.' }

      - name: Build EXE and release ZIP
        env:
          PACKAGE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          ./build-cassette.ps1 -Python (Get-Command python).Source -Version $env:PACKAGE_VERSION

      - name: Smoke test packaged application
        run: |
          python -c "import subprocess; p = subprocess.run(['dist/TBMCassettePlayer/TBMCassettePlayer.exe', '--smoke-test'], timeout=30); raise SystemExit(p.returncode)"
          if ($LASTEXITCODE -ne 0) { throw 'Packaged EXE smoke test failed.' }

      - name: Verify ZIP contents
        env:
          PACKAGE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          @'
          import os
          from zipfile import ZipFile
          archive = f"dist/TBMCassettePlayer-v{os.environ['PACKAGE_VERSION']}-win-x64.zip"
          with ZipFile(archive) as package:
              names = {name.replace('\\', '/') for name in package.namelist()}
              assert 'TBMCassettePlayer/TBMCassettePlayer.exe' in names
              assert any(name.startswith('TBMCassettePlayer/_internal/') for name in names)
              assert package.testzip() is None, 'ZIP checksum validation failed'
          print('Verified:', archive)
          '@ | python -
          if ($LASTEXITCODE -ne 0) { throw 'ZIP validation failed.' }

      - name: Upload downloadable build
        uses: actions/upload-artifact@v7
        with:
          name: TBMCassettePlayer-v${{ steps.version.outputs.version }}-win-x64
          path: dist/TBMCassettePlayer-v*-win-x64.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Publish GitHub Release for version tag
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PACKAGE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          $archive = "dist/TBMCassettePlayer-v$env:PACKAGE_VERSION-win-x64.zip"
          gh release view $env:GITHUB_REF_NAME --json tagName *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:GITHUB_REF_NAME $archive --clobber
          } else {
            $releaseArguments = @('release', 'create', $env:GITHUB_REF_NAME, $archive,
              '--verify-tag', '--generate-notes', '--title', "TBM Cassette Player $env:GITHUB_REF_NAME")
            if ($env:PACKAGE_VERSION.Contains('-')) { $releaseArguments += '--prerelease' }
            gh @releaseArguments
          }
          if ($LASTEXITCODE -ne 0) { throw 'GitHub Release publication failed. Check the job token permissions and release settings.' }
